name: 文档问题
description: 报告文档缺失、错误或过期
title: "[Docs] "
body:
  - type: input
    id: page
    attributes:
      label: 文档路径
      placeholder: docs/zh/QUICKSTART.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 哪一句/哪段不对，正确内容是什么
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改法
    validations:
      required: false
