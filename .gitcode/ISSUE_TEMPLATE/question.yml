name: 提问 / 讨论
description: 使用、构建或设计上的疑问
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 先说明你已尝试过什么、卡在哪里
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 上下文
      description: 相关命令、日志、文档链接
    validations:
      required: false
