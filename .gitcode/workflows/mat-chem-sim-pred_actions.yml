name: PR-pipeline_mat-chem-sim-pred

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

# PR 事件自动触发；评论 /compile 保留为手动重跑。
# GitCode 的 PR 事件类型是 open / update / reopen（不是 opened / synchronize）。
on:
  pull_request:
    types: [ open, update, reopen ]
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  # base_ref 是 PR 的目标分支（master）。不要用 ref_name：未合并 PR 的 ref_name
  # 是 "<PR 号>/merge"，不是 master。
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ vars.OBS_PATH }}/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              allow-unsafe-pr-checkout: true
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
      - type: auto
    fail-fast: true

  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
    pre:
      - type: auto
    fail-fast: false

  stage3:
    name: UT
    jobs:
      # UT：ARM 编译 + ctest。shard 只表示并发度，不表示族；
      # 新增族不需要改本文件，build.sh 会从 cmake/variables.cmake 发现。
      # --ut=auto：镜像有 GTest 才真正跑 ctest；镜像补齐 GTest 后改成 required。
      JOB_ut_1:
        name: UT_Build_and_Test_1
        steps:
          - name: Resolve_checkout_sha
            identifier: resolve_sha
            run: |
              sha="${{ atomgit.event.pull_request.merge_commit_sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.event.pull_request.head.sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.sha }}"
              echo "sha=$sha" >> "$ATOMGIT_OUTPUT"
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ steps.resolve_sha.outputs.sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --test --shard=1/2 --ut=auto
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_ut_2:
        name: UT_Build_and_Test_2
        steps:
          - name: Resolve_checkout_sha
            identifier: resolve_sha
            run: |
              sha="${{ atomgit.event.pull_request.merge_commit_sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.event.pull_request.head.sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.sha }}"
              echo "sha=$sha" >> "$ATOMGIT_OUTPUT"
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ steps.resolve_sha.outputs.sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --test --shard=2/2 --ut=auto
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      # 需要 NPU 的 Python 算子（cmake/variables.cmake 的 NPU 列表）。
      # 设备分类写在配置里，workflow 只按设备类型分 job。
      JOB_npu:
        name: NPU_Python_Tests
        steps:
          - name: Resolve_checkout_sha
            identifier: resolve_sha
            run: |
              sha="${{ atomgit.event.pull_request.merge_commit_sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.event.pull_request.head.sha }}"
              [ -n "$sha" ] || sha="${{ atomgit.sha }}"
              echo "sha=$sha" >> "$ATOMGIT_OUTPUT"
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ steps.resolve_sha.outputs.sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Run_npu_python_tests
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --python-tests=npu
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
    pre:
      - type: auto
    fail-fast: false

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
